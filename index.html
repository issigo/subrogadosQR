<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Servicios Subrogados</title>
  
  <!-- Chart.js y DataLabels -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  
  <style>
    /* ==========================================
       MODO OSCURO (POR DEFECTO)
       ========================================== */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a1a; 
      color: #ffffff;
      margin: 0;
      padding: 20px;
      transition: background-color 0.4s ease;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #222222;
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 5px solid #d3a32a;
      transition: all 0.4s ease;
    }
    .topbar-title {
      font-size: 18px;
      font-weight: bold;
    }
    /* El botón secreto */
    .btn-secreto {
      cursor: pointer;
      user-select: none;
    }
    .topbar select {
      background-color: #333333;
      color: #ffffff;
      border: 1px solid #555;
      padding: 8px 15px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
    .kpi-card {
      background-color: #222222;
      padding: 25px 20px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: all 0.4s ease;
    }
    .kpi-title {
      color: #a0a0a0; font-size: 12px; font-weight: bold;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;
    }
    .kpi-value { font-size: 28px; font-weight: bold; }
    
    .color-gold { color: #d3a32a; }
    .color-green { color: #4caf50; }
    .color-orange { color: #ff9800; }

    .charts-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 20px; }
    .chart-card {
      background-color: #222222; padding: 20px; border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); height: 400px; position: relative;
      transition: all 0.4s ease;
    }

    .table-section {
      background-color: #222222; padding: 20px; border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: all 0.4s ease;
    }
    .filter-bar {
      display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
      padding-bottom: 15px; border-bottom: 1px solid #333;
    }
    .filter-bar label { font-weight: bold; color: #eeeeee; font-size: 14px; }
    .filter-bar select { background-color: #333333; color: #ffffff; border: 1px solid #555; padding: 8px 15px; border-radius: 4px; width: 300px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; }
    th { color: #ffffff; font-weight: bold; font-size: 14px; }
    tr:hover { background-color: #2a2a2a; }
    
    .td-prov { font-weight: bold; color: #ffffff; }
    .td-monto { text-align: right; color: #d3a32a; font-weight: bold; }

    #loading { text-align: center; padding: 50px; font-size: 18px; color: #d3a32a; }

    /* ==========================================
       MODO INSTITUCIONAL (GUINDA Y BLANCO)
       ========================================== */
    body.institucional {
      background-color: #f4f6f8; 
      color: #333333;
    }
    body.institucional .topbar {
      background-color: #611232; /* Guinda */
      border-left: 5px solid #b99725; /* Dorado institucional */
      color: #ffffff;
    }
    body.institucional .topbar select {
      background-color: #ffffff; color: #333333; border: 1px solid #ccc;
    }
    body.institucional .kpi-card,
    body.institucional .chart-card,
    body.institucional .table-section {
      background-color: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    body.institucional .kpi-title { color: #666666; }
    
    /* Cambiamos los dorados por guindas para resaltar en fondo blanco */
    body.institucional .color-gold { color: #611232; } 
    
    body.institucional .filter-bar { border-bottom: 1px solid #ddd; }
    body.institucional .filter-bar label { color: #333333; }
    body.institucional .filter-bar select {
      background-color: #ffffff; color: #333333; border: 1px solid #aaa;
    }
    
    body.institucional th {
      color: #611232; border-bottom: 2px solid #b99725;
    }
    body.institucional td { border-bottom: 1px solid #eeeeee; }
    body.institucional tr:hover { background-color: #f9f9f9; }
    
    body.institucional .td-prov { color: #333333; }
    body.institucional .td-monto { color: #611232; }


    /* ==========================================
       MODO RESPONSIVO (TELÉFONOS Y TABLETS)
       ========================================== */
    @media screen and (max-width: 768px) {
      /* Reacomodar el menú superior */
      .topbar {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
      .topbar select {
        width: 100%;
      }

      /* Los 4 KPIs pasan de estar en línea a estar en 2 columnas (o 1 en pantallas muy chicas) */
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      /* Las gráficas se apilan una debajo de la otra */
      .charts-grid {
        grid-template-columns: 1fr; 
      }
      .chart-card {
        height: 350px; /* Reduce un poco la altura en móviles */
      }

      /* El filtro de la tabla se adapta al ancho de la pantalla */
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-bar select {
        width: 100%;
      }

      /* Reduce el padding general para aprovechar el espacio en móviles */
      body {
        padding: 10px;
      }
    }

    /* Para teléfonos aún más pequeños (pantallas muy estrechas) */
    @media screen and (max-width: 480px) {
      .kpi-grid {
        grid-template-columns: 1fr; /* 1 solo KPI por fila */
      }
      .kpi-card {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-title">
      <!-- BOTÓN SECRETO: El icono 📊 -->
      <span class="btn-secreto" onclick="toggleTheme()" title="Cambiar Apariencia">📊</span> Dashboard de Servicios Subrogados
    </div>
    <select id="hospitalSelect" onchange="loadData()">
      <option value="TODAS" selected>TODAS LAS UNIDADES</option>
      <option value="HG CANCÚN" >HG CANCÚN</option>
      <option value="HG PLAYA DEL CARMEN">HG PLAYA DEL CARMEN</option>
      <option value="HG CHETUMAL">HG CHETUMAL</option>
      <option value="HG COZUMEL">HG COZUMEL</option>
      <option value="HG FCP">HG FELIPE CARRILLO PUERTO</option>
      <option value="DSS">DSS</option>
    </select>
  </div>

  <div id="loading">Cargando datos en tiempo real...</div>

  <div id="dashboard-content" style="display: none;">
    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-title">Deuda Inicial Original</div>
        <div class="kpi-value color-gold" id="kpi-inicial">$0.00</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Monto Total Pagado</div>
        <div class="kpi-value color-green" id="kpi-pagado">$0.00</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Deuda Pendiente Activa</div>
        <div class="kpi-value color-gold" id="kpi-pendiente">$0.00</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Expedientes Pendientes</div>
        <div class="kpi-value color-orange" id="kpi-expedientes">0</div>
      </div>
    </div>

    <!-- Gráficas -->
    <div class="charts-grid">
      <div class="chart-card">
        <canvas id="donutChart"></canvas>
      </div>
      <div class="chart-card">
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <!-- Tabla de Proveedores -->
    <div class="table-section">
      <div class="filter-bar">
        <label for="proveedorSelect">🔍 Filtrar expedientes por Proveedor:</label>
        <select id="proveedorSelect" onchange="aplicarFiltroProveedor()">
          <option value="TODOS">TODOS LOS PROVEEDORES</option>
        </select>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Servicio</th>
              <th>Tipo</th>
              <th>Paciente</th>
              <th style="text-align: right;">Monto Total</th>
            </tr>
          </thead>
          <tbody id="tablaBody">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // INSERTA TU URL DE APPS SCRIPT AQUÍ
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbypUEKgPN7dtLT1CApu0tKnC_9gqdQVqDqKTD_53RpytSRBRXKAKS6cQUIqwo278_UneA/exec"; 

    const formatter = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
    Chart.register(ChartDataLabels);
    let donutChart = null;
    let barChart = null;
    let tablaGlobal = [];
    let currentData = null; // Guardamos los datos para repintar gráficas sin descargar de nuevo
    
    // Bandera para saber qué tema está activo
    let esInstitucional = false;

    // Función del menú oculto (Cambio de tema)
    function toggleTheme() {
      esInstitucional = !esInstitucional;
      document.body.classList.toggle('institucional', esInstitucional);
      
      // Si ya hay datos cargados, redibujamos las gráficas con los nuevos colores
      if (currentData) {
        renderCharts(currentData);
        aplicarFiltroProveedor(); // Repinta la tabla para aplicar clases
      }
    }

    function loadData() {
      const unidad = document.getElementById('hospitalSelect').value;
      const url = API_URL + "?unidad=" + encodeURIComponent(unidad) + "&t=" + new Date().getTime();
      
      document.getElementById('loading').style.display = 'block';
      document.getElementById('dashboard-content').style.display = 'none';

      fetch(url)
        .then(response => response.json())
        .then(data => {
          currentData = data; // Respaldamos los datos
          
          document.getElementById('kpi-inicial').innerText = formatter.format(data.kpis.deudaInicial);
          document.getElementById('kpi-pagado').innerText = formatter.format(data.kpis.montoPagado);
          document.getElementById('kpi-pendiente').innerText = formatter.format(data.kpis.deudaTotal);
          document.getElementById('kpi-expedientes').innerText = data.kpis.expedientesPendientes;

          renderCharts(data);

          tablaGlobal = data.table;
          llenarSelectProveedores();
          aplicarFiltroProveedor();

          document.getElementById('loading').style.display = 'none';
          document.getElementById('dashboard-content').style.display = 'block';
        })
        .catch(error => {
          console.error("Error al cargar:", error);
          document.getElementById('loading').innerHTML = "Error al conectar con la base de datos.";
        });
    }

    function renderCharts(data) {
      // Definimos colores dinámicos según el tema activo
      const chartTextColor = esInstitucional ? '#333333' : '#cccccc';
      const chartTitleColor = esInstitucional ? '#611232' : '#ffffff';
      const chartGridColor = esInstitucional ? '#e0e0e0' : '#333333';
      const barraColor = esInstitucional ? '#8b1c3f' : '#d3a32a'; // Guinda en claro, Dorado en oscuro
      const donaPendienteColor = esInstitucional ? '#8b1c3f' : '#d3a32a';

      // --- Gráfica de Dona ---
      // --- Gráfica de Dona ---
      if(donutChart) donutChart.destroy();
      const ctxDonut = document.getElementById('donutChart').getContext('2d');
      donutChart = new Chart(ctxDonut, {
        type: 'doughnut',
        data: {
          labels: ['Pagado', 'Pendiente'],
          datasets: [{
            data: [data.kpis.montoPagado, data.kpis.deudaTotal],
            backgroundColor: ['#4caf50', donaPendienteColor],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '65%', 
          plugins: {
            title: { display: true, text: 'Avance de Pagos Global', color: chartTitleColor, font: { size: 14, weight: 'bold' } },
            legend: { position: 'bottom', labels: { color: chartTextColor } },
            
            // Forzamos la visualización de las etiquetas
            datalabels: {
              display: true,
              color: '#ffffff', // Letras blancas
              font: { weight: 'bold', size: 14 },
              anchor: 'center', // Centrado en la rebanada
              align: 'center',  // Alineación al centro
              formatter: function(value, context) {
                const dataArr = context.chart.data.datasets[0].data;
                const total = dataArr.reduce((a, b) => a + b, 0);
                
                // Si el valor es cero o no hay datos, no dibujamos nada
                if (total === 0 || value === 0) return '';
                
                // Calcula y devuelve el porcentaje
                let porcentaje = ((value / total) * 100).toFixed(1) + '%';
                return porcentaje;
              }
            }
          }
        }
      });
      // --- Gráfica de Barras ---
      if(barChart) barChart.destroy();
      const ctxBar = document.getElementById('barChart').getContext('2d');
      barChart = new Chart(ctxBar, {
        type: 'bar',
        plugins: [ChartDataLabels],
        data: {
          labels: data.graficaProveedores.labels,
          datasets: [{
            data: data.graficaProveedores.values,
            backgroundColor: barraColor, 
            borderRadius: 2
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: { right: 80 }
          },
          plugins: {
            title: { display: true, text: 'Top 10 Proveedores (Mayor Deuda Activa)', color: chartTitleColor, font: { size: 14, weight: 'bold' } },
            legend: { display: false },
            datalabels: {
              anchor: 'end',
              align: 'right',
              color: chartTextColor,
              font: { weight: 'bold', size: 11 },
              formatter: function(value) {
                return formatter.format(value);
              }
            }
          },
          scales: {
            x: { 
              grid: { color: chartGridColor },
              ticks: { color: chartTextColor, callback: function(value) { return formatter.format(value); } }
            },
            y: { 
              grid: { display: false },
              ticks: { color: chartTextColor }
            }
          }
        }
      });
    }

    // --- Filtro Dinámico ---
    function llenarSelectProveedores() {
      const select = document.getElementById('proveedorSelect');
      select.innerHTML = '<option value="TODOS">TODOS LOS PROVEEDORES</option>';
      
      let proveedores = tablaGlobal.map(fila => fila[0]);
      let proveedoresUnicos = [...new Set(proveedores)].sort();
      
      proveedoresUnicos.forEach(prov => {
        if (prov && String(prov).trim() !== "") {
          let opt = document.createElement('option');
          opt.value = prov;
          opt.textContent = prov;
          select.appendChild(opt);
        }
      });
    }

    function aplicarFiltroProveedor() {
      const provSelect = document.getElementById('proveedorSelect').value;
      const tbody = document.getElementById('tablaBody');
      tbody.innerHTML = ''; 
      
      let tablaFiltrada = provSelect === "TODOS" ? tablaGlobal : tablaGlobal.filter(fila => fila[0] === provSelect);
      
      tablaFiltrada.forEach(row => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="td-prov">${row[0]}</td>
          <td>${row[1]}</td>
          <td>${row[2]}</td>
          <td>${row[3]}</td>
          <td class="td-monto">${formatter.format(row[4])}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.onload = loadData;
  </script>
</body>
</html>
