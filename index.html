

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Servicios Subrogados Quintana Roo</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  
  <style>
    /* ==========================================
       MODO OSCURO (POR DEFECTO)
       ========================================== */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #ffffff; margin: 0; padding: 20px; transition: background-color 0.4s ease; }
    
    .topbar { display: flex; justify-content: space-between; align-items: center; background-color: #222222; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #d3a32a; transition: all 0.4s ease; }
    .topbar-title { font-size: 18px; font-weight: bold; }
    .btn-secreto { cursor: pointer; user-select: none; }
    
    .topbar-controls { display: flex; align-items: center; gap: 15px; }
    .btn-nuevo { background: #d3a32a; color: #000; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; border: none; }
    .topbar select { background-color: #333333; color: #ffffff; border: 1px solid #555; padding: 8px 15px; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
    .kpi-card { background-color: #222222; padding: 25px 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: all 0.4s ease; }
    .kpi-title { color: #a0a0a0; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
    .kpi-value { font-size: 28px; font-weight: bold; }
    .color-gold { color: #d3a32a; } .color-green { color: #4caf50; } .color-orange { color: #ff9800; }

    .charts-grid-top { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 20px; }
    .charts-grid-bottom { display: grid; grid-template-columns: 1fr; margin-bottom: 20px; }
    .chart-card { background-color: #222222; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); height: 400px; position: relative; transition: all 0.4s ease; }

    .table-section { background-color: #222222; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: all 0.4s ease; }

    /* ==========================================
       PAGINACIÓN DE LA TABLA
       ========================================== */
    .pagination-controls {
      display: flex; justify-content: flex-end; align-items: center; 
      gap: 15px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #333;
    }
    .btn-page {
      background-color: #333333; color: #ffffff; border: 1px solid #555; 
      padding: 6px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s;
    }
    .btn-page:hover:not(:disabled) { background-color: #555555; }
    .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }
    #pageInfo { font-size: 13px; color: #aaaaaa; }

    /* Adaptación al Modo Institucional */
    body.institucional .pagination-controls { border-top: 1px solid #ddd; }
    body.institucional .btn-page { background-color: #ffffff; color: #611232; border: 1px solid #ccc; }
    body.institucional .btn-page:hover:not(:disabled) { background-color: #f0f0f0; }
    body.institucional #pageInfo { color: #555555; font-weight: bold; }
    .filter-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #333; }
    .filter-bar label { font-weight: bold; color: #eeeeee; font-size: 14px; }
    .filter-bar select { background-color: #333333; color: #ffffff; border: 1px solid #555; padding: 8px 15px; border-radius: 4px; width: 300px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; }
    th { color: #ffffff; font-weight: bold; font-size: 14px; }
    tr:hover { background-color: #2a2a2a; }
    .td-prov { font-weight: bold; color: #ffffff; }
    .td-monto { text-align: right; color: #d3a32a; font-weight: bold; }
    #loading { text-align: center; padding: 50px; font-size: 18px; color: #d3a32a; }

    /* ==========================================
       MODALES (FORMULARIOS)
       ========================================== */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center; }
    .modal-box { background: #222222; padding: 30px; border-radius: 8px; width: 400px; max-width: 90%; border-top: 5px solid #d3a32a; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow-y: auto; max-height: 90vh; }
    .modal-box h2 { margin-top: 0; margin-bottom: 20px; font-size: 18px; color: #fff; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; box-sizing: border-box; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
    .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-cancelar { background: #555; color: #fff; }
    .btn-guardar { background: #d3a32a; color: #000; }

    body.institucional .filter-bar select, body.institucional .filter-bar input { background-color: #ffffff; color: #333333; border: 1px solid #aaa; }

    /* ==========================================
       MODO INSTITUCIONAL
       ========================================== */
    body.institucional { background-color: #f4f6f8; color: #333333; }
    body.institucional .topbar { background-color: #611232; border-left: 5px solid #b99725; color: #ffffff; }
    body.institucional .topbar select { background-color: #ffffff; color: #333333; border: 1px solid #ccc; }
    body.institucional .btn-nuevo { background: #b99725; color: #fff; }
    body.institucional .kpi-card, body.institucional .chart-card, body.institucional .table-section { background-color: #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    body.institucional .kpi-title { color: #666666; }
    body.institucional .color-gold { color: #611232; } 
    body.institucional .filter-bar { border-bottom: 1px solid #ddd; }
    body.institucional .filter-bar label { color: #333333; }
    body.institucional .filter-bar select { background-color: #ffffff; color: #333333; border: 1px solid #aaa; }
    body.institucional th { color: #611232; border-bottom: 2px solid #b99725; }
    body.institucional td { border-bottom: 1px solid #eeeeee; }
    body.institucional tr:hover { background-color: #f9f9f9; }
    body.institucional .td-prov { color: #333333; }
    body.institucional .td-monto { color: #611232; }
    body.institucional .modal-box { background: #ffffff; border-top: 5px solid #611232; }
    body.institucional .modal-box h2 { color: #611232; }
    body.institucional .form-group label { color: #555; }
    body.institucional .form-group input, body.institucional .form-group select { background: #fff; border: 1px solid #ccc; color: #333; }
    body.institucional .btn-guardar { background: #611232; color: #fff; }

    /* ==========================================
       MODO RESPONSIVO (MÓVILES)
       ========================================== */
    @media screen and (max-width: 768px) {
      .topbar { flex-direction: column; gap: 15px; text-align: center; }
      .topbar-controls { flex-direction: column; width: 100%; }
      .topbar select, .btn-nuevo { width: 100%; text-align: center; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid-top { grid-template-columns: 1fr; }
      .chart-card { height: 350px; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-bar select { width: 100%; }
      body { padding: 10px; }
    }
    @media screen and (max-width: 480px) { .kpi-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-title">
      <span class="btn-secreto" onclick="toggleTheme()" title="Cambiar Apariencia">📊</span> Dashboard de Servicios Subrogados
    </div>
    <div class="topbar-controls">
      <button class="btn-nuevo" onclick="abrirModal()">+ Nuevo Registro</button>
      <select id="hospitalSelect" onchange="loadData()">
        <option value="TODAS" selected>TODAS LAS UNIDADES</option>
        <option value="HG CANCÚN">HG CANCÚN</option>
        <option value="HG PLAYA DEL CARMEN">HG PLAYA DEL CARMEN</option>
        <option value="HG CHETUMAL">HG CHETUMAL</option>
        <option value="HG COZUMEL">HG COZUMEL</option>
        <option value="HG FCP">HG FELIPE CARRILLO PUERTO</option>
        <option value="DSS">DSS</option>
      </select>
    </div>
  </div>

  <div id="loading">Cargando datos en tiempo real...</div>

  <!-- Modal 1: Nuevo Registro -->
  <div class="modal-overlay" id="modalRegistro">
    <div class="modal-box">
      <h2>Agregar Nuevo Expediente</h2>
      <div class="form-group">
        <label>Unidad Hospitalaria</label>
        <select id="formUnidad">
          <option value="HG CANCÚN">HG CANCÚN</option>
          <option value="HG PLAYA DEL CARMEN">HG PLAYA DEL CARMEN</option>
          <option value="HG CHETUMAL">HG CHETUMAL</option>
          <option value="HG COZUMEL">HG COZUMEL</option>
          <option value="HG FCP">HG FELIPE CARRILLO PUERTO</option>
          <option value="DSS">DSS</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tipo de Servicio</label>
        <select id="formServicio">
          <option value="IMAGENOLOGIA">IMAGENOLOGIA</option>
          <option value="ENDOSCOPIA">ENDOSCOPIA</option>
          <option value="LABORATORIOS">LABORATORIOS</option>
          <option value="CIRUGÍA RECONSTRUCTIVA">CIRUGÍA RECONSTRUCTIVA</option>
          <option value="NEUROPEDIATRÍA">NEUROPEDIATRÍA</option>
          <option value="MATERIAL DE CURACION">MATERIAL DE CURACIÓN</option>
          <option value="OTROS">OTROS</option>
        </select>
      </div>
      <div class="form-group">
        <label>Proveedor (Texto libre)</label>
        <input type="text" id="formProveedor" placeholder="Ej. YAHAPP MEXICO SA DE CV">
      </div>
      <div class="form-group">
        <label>Nombre del Paciente (Texto libre)</label>
        <input type="text" id="formPaciente" placeholder="Ej. Juan Pérez">
      </div>
      <div class="form-group">
        <label>Monto Total Deuda ($)</label>
        <input type="number" id="formMonto" step="0.01" placeholder="Ej. 25000.50">
      </div>
      <div class="form-group">
        <label>Estatus Homologado</label>
        <select id="formEstatus">
          <option value="PENDIENTE">PENDIENTE</option>
          <option value="EN PROCESO / EN REVISIÓN">EN PROCESO / EN REVISIÓN</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-guardar" id="btnGuardar" onclick="guardarRegistro()">Guardar Registro</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Actualizar / Pagar Registro -->
  <div class="modal-overlay" id="modalEdicion">
    <div class="modal-box">
      <h2>Actualizar Pago y Estatus</h2>
      <p id="editInfo" style="color:#aaa; font-size:12px; margin-bottom:15px;"></p>
      <input type="hidden" id="editId">

      <div class="form-group">
        <label>Nuevo Estatus Homologado</label>
        <select id="editEstatus">
          <option value="PAGADO">PAGADO</option>
          <option value="CANCELADO">CANCELADO</option>
          <option value="EN PROCESO / EN REVISIÓN">EN PROCESO / EN REVISIÓN</option>
        </select>
      </div>
      <div class="form-group">
        <label>Fecha de Radicación (Pago)</label>
        <input type="date" id="editFechaPago">
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancelar" onclick="cerrarModalEdicion()">Cancelar</button>
        <button class="btn btn-guardar" id="btnGuardarEdicion" onclick="guardarEdicion()">Actualizar</button>
      </div>
    </div>
  </div>

  <!-- Contenedor del Dashboard -->
  <div id="dashboard-content" style="display: none;">
    
    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-title">Deuda Inicial Original</div><div class="kpi-value color-gold" id="kpi-inicial">$0.00</div></div>
      <div class="kpi-card"><div class="kpi-title">Monto Total Pagado</div><div class="kpi-value color-green" id="kpi-pagado">$0.00</div></div>
      <div class="kpi-card"><div class="kpi-title">Deuda Pendiente Activa</div><div class="kpi-value color-gold" id="kpi-pendiente">$0.00</div></div>
      <div class="kpi-card"><div class="kpi-title">Expedientes Pendientes</div><div class="kpi-value color-orange" id="kpi-expedientes">0</div></div>
    </div>

    <!-- Gráficas Superiores (Dona y Top 10) -->
    <div class="charts-grid-top">
      <div class="chart-card"><canvas id="donutChart"></canvas></div>
      <div class="chart-card"><canvas id="barChart"></canvas></div>
    </div>

    <!-- Gráfica Inferior (Lead Time) -->
    <div class="charts-grid-bottom">
      <div class="chart-card"><canvas id="leadTimeChart"></canvas></div>
    </div>

    <!-- Tabla de Proveedores -->
    <div class="table-section">
     <div class="filter-bar">
        <label for="proveedorSelect">🔍 Filtros:</label>
        
        <select id="proveedorSelect" onchange="aplicarFiltros()">
          <option value="TODOS">TODOS LOS PROVEEDORES</option>
        </select>

        <!-- Nuevo buscador dinámico por paciente -->
        <input type="text" id="pacienteInput" oninput="aplicarFiltros()" placeholder="Buscar paciente..." 
               style="padding: 8px 15px; border-radius: 4px; border: 1px solid #555; background-color: #333333; color: #ffffff; width: 250px;">
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Servicio</th>
              <th>Tipo</th>
              <th>Paciente</th>
              <th style="text-align: right;">Monto Total</th>
              <th style="text-align: center;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaBody">
            <!-- Filas dinámicas -->
          </tbody>
        </table>

        <div style="overflow-x: auto;">
        <table>
          <!-- ... tus encabezados y tbody id="tablaBody" ... -->
        </table>
      </div>
      
      <!-- NUEVO: Controles de Paginación -->
      <div class="pagination-controls" id="paginationControls">
        <button class="btn-page" onclick="prevPage()" id="btnPrev">Anterior</button>
        <span id="pageInfo">Página 1 de 1</span>
        <button class="btn-page" onclick="nextPage()" id="btnNext">Siguiente</button>
      </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN PRINCIPAL
    // ==========================================
    Chart.register(ChartDataLabels);
    const API_URL = "https://script.google.com/macros/s/AKfycbzSnX6mk5vObtXlEcOcPIlHZXUFUSABdA6Fy1MliCpMdWYSIQqM5RTIi2FKNBXZcNoj9Q/exec"; 
    const formatter = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
    
    let donutChart = null;
    let barChart = null;
    let leadTimeChart = null;
    let tablaGlobal = [];
    let currentData = null; 
    let esInstitucional = false;

    // ==========================================
    // LOGICA DEL DASHBOARD
    // ==========================================
    function toggleTheme() {
      esInstitucional = !esInstitucional;
      document.body.classList.toggle('institucional', esInstitucional);
      if (currentData) {
        renderCharts(currentData);
        aplicarFiltros(); 
      }
    }

    function loadData() {
      const unidad = document.getElementById('hospitalSelect').value;
      const url = API_URL + "?unidad=" + encodeURIComponent(unidad) + "&t=" + new Date().getTime();
      
      document.getElementById('loading').style.display = 'block';
      document.getElementById('dashboard-content').style.display = 'none';

      fetch(url)
        .then(response => response.json())
        .then(data => {
          currentData = data; 
          document.getElementById('kpi-inicial').innerText = formatter.format(data.kpis.deudaInicial);
          document.getElementById('kpi-pagado').innerText = formatter.format(data.kpis.montoPagado);
          document.getElementById('kpi-pendiente').innerText = formatter.format(data.kpis.deudaTotal);
          document.getElementById('kpi-expedientes').innerText = data.kpis.expedientesPendientes;

          renderCharts(data);
          tablaGlobal = data.table;
          llenarSelectProveedores();
          aplicarFiltros();

          document.getElementById('loading').style.display = 'none';
          document.getElementById('dashboard-content').style.display = 'block';
        })
        .catch(error => {
          console.error("Error al cargar:", error);
          document.getElementById('loading').innerHTML = "Error de conexión. Verifica la URL de tu API.";
        });
    }

    function renderCharts(data) {
      const chartTextColor = esInstitucional ? '#333333' : '#cccccc';
      const chartTitleColor = esInstitucional ? '#611232' : '#ffffff';
      const chartGridColor = esInstitucional ? '#e0e0e0' : '#333333';
      const barraColor = esInstitucional ? '#8b1c3f' : '#d3a32a'; 
      const donaPendienteColor = esInstitucional ? '#8b1c3f' : '#d3a32a';

      // 1. Dona (Avance Financiero con centro dinámico)
      const centerTextPlugin = {
        id: 'centerText',
        beforeDraw: function(chart) {
          const width = chart.width, height = chart.height, ctx = chart.ctx;
          ctx.restore();
          
          const dataArr = chart.config.data.datasets[0].data;
          const total = dataArr[0] + dataArr[1]; 
          let porcentajeText = "0%";
          if (total > 0) porcentajeText = ((dataArr[1] / total) * 100).toFixed(1) + "%";

          const fontSize = (height / 120).toFixed(2);
          ctx.font = "bold " + fontSize + "em Segoe UI, sans-serif";
          ctx.textBaseline = "middle";
          ctx.fillStyle = esInstitucional ? '#8b1c3f' : '#d3a32a'; 
          
          const textX = Math.round((width - ctx.measureText(porcentajeText).width) / 2);
          const textY = height / 2 + 15; 
          ctx.fillText(porcentajeText, textX, textY);
          
          ctx.font = "bold " + (fontSize / 3).toFixed(2) + "em Segoe UI, sans-serif";
          ctx.fillStyle = esInstitucional ? '#666666' : '#a0a0a0';
          const label = "PENDIENTE";
          const labelX = Math.round((width - ctx.measureText(label).width) / 2);
          ctx.fillText(label, labelX, textY + 25);
          ctx.save();
        }
      };

      if(donutChart instanceof Chart) donutChart.destroy();
      const ctxDonut = document.getElementById('donutChart').getContext('2d');
      donutChart = new Chart(ctxDonut, {
        type: 'doughnut',
        plugins: [ChartDataLabels, centerTextPlugin], 
        data: {
          labels: ['Pagado', 'Pendiente'],
          datasets: [{ data: [data.kpis.montoPagado, data.kpis.deudaTotal], backgroundColor: ['#4caf50', donaPendienteColor], borderWidth: 0 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '70%', 
          plugins: {
            title: { display: true, text: 'Avance de Pagos Global', color: chartTitleColor, font: { size: 14, weight: 'bold' } },
            legend: { position: 'bottom', labels: { color: chartTextColor } }, datalabels: { display: false } 
          }
        }
      });

      // 2. Barras (Top 10 Proveedores)
      if(barChart instanceof Chart) barChart.destroy();
      const ctxBar = document.getElementById('barChart').getContext('2d');
      barChart = new Chart(ctxBar, {
        type: 'bar', plugins: [ChartDataLabels],
        data: { labels: data.graficaProveedores.labels, datasets: [{ data: data.graficaProveedores.values, backgroundColor: barraColor, borderRadius: 2 }] },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false, layout: { padding: { right: 80 } },
          plugins: {
            title: { display: true, text: 'Top 10 Proveedores (Mayor Deuda Activa)', color: chartTitleColor, font: { size: 14, weight: 'bold' } },
            legend: { display: false },
            datalabels: { anchor: 'end', align: 'right', color: chartTextColor, font: { weight: 'bold', size: 11 }, formatter: function(value) { return formatter.format(value); } }
          },
          scales: {
            x: { grid: { color: chartGridColor }, ticks: { color: chartTextColor, callback: function(val) { return formatter.format(val); } } },
            y: { grid: { display: false }, ticks: { color: chartTextColor } }
          }
        }
      });

      // 3. Lead Time (Semáforo)
      if(leadTimeChart instanceof Chart) leadTimeChart.destroy();
      const ctxLead = document.getElementById('leadTimeChart').getContext('2d');
      leadTimeChart = new Chart(ctxLead, {
        type: 'bar', plugins: [ChartDataLabels],
        data: {
          labels: data.graficaLeadTime.labels,
          datasets: [{
            data: data.graficaLeadTime.values,
            backgroundColor: function(ctx) {
              const dias = ctx.raw;
              if (dias > 60) return esInstitucional ? '#611232' : '#8b1c3f';
              if (dias > 30) return esInstitucional ? '#b99725' : '#d3a32a';
              return '#4caf50';
            }, borderRadius: 2
          }]
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false, layout: { padding: { right: 50 } },
          plugins: {
            title: { display: true, text: 'Lead Time (Días Promedio de Pago)', color: chartTitleColor, font: { size: 14, weight: 'bold' } },
            legend: { display: false },
            datalabels: { anchor: 'end', align: 'right', color: chartTextColor, font: { weight: 'bold', size: 11 }, formatter: val => val + " Días" }
          },
          scales: {
            x: { grid: { color: chartGridColor }, ticks: { color: chartTextColor } },
            y: { grid: { display: false }, ticks: { color: chartTextColor } }
          }
        }
      });
    }

    // ==========================================
    // FILTROS Y TABLA
    // ==========================================
    function llenarSelectProveedores() {
      const select = document.getElementById('proveedorSelect');
      select.innerHTML = '<option value="TODOS">TODOS LOS PROVEEDORES</option>';
      let proveedores = tablaGlobal.map(fila => fila[0]);
      let proveedoresUnicos = [...new Set(proveedores)].sort();
      proveedoresUnicos.forEach(prov => {
        if (prov && String(prov).trim() !== "") {
          let opt = document.createElement('option');
          opt.value = prov; opt.textContent = prov; select.appendChild(opt);
        }
      });
    }

function aplicarFiltros() {
      const provSelect = document.getElementById('proveedorSelect').value;
      const pacienteTexto = document.getElementById('pacienteInput').value.toLowerCase().trim();
      const tbody = document.getElementById('tablaBody');
      tbody.innerHTML = ''; 
      
      // Filtramos evaluando tanto el select de proveedor como el texto del paciente
      let tablaFiltrada = tablaGlobal.filter(fila => {
        const coincideProveedor = (provSelect === "TODOS" || fila[0] === provSelect);
        const nombrePaciente = String(fila[3]).toLowerCase();
        const coincidePaciente = nombrePaciente.includes(pacienteTexto);
        
        return coincideProveedor && coincidePaciente;
      });
      
      tablaFiltrada.forEach(row => {
        let tr = document.createElement('tr');
        // Limpiamos comillas simples para que no rompan el botón de Pagar
        let provLimpio = String(row[0]).replace(/'/g, "\\'");
        let pacLimpio = String(row[3]).replace(/'/g, "\\'");
        
        tr.innerHTML = `
          <td class="td-prov">${row[0]}</td>
          <td>${row[1]}</td>
          <td>${row[2]}</td>
          <td>${row[3]}</td>
          <td class="td-monto">${formatter.format(row[4])}</td>
          <td style="text-align: center;">
            <button onclick="abrirModalEdicion(${row[5]}, '${provLimpio}', '${pacLimpio}')" 
                    style="background:${esInstitucional ? '#611232' : '#b99725'}; color:#fff; border:none; padding:5px 10px; border-radius:3px; cursor:pointer; font-weight:bold;">
              ✏️ Pagar
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ==========================================
    // FUNCIONES DE MODALES (CREAR Y EDITAR)
    // ==========================================
    function abrirModal() {
      const unidadActual = document.getElementById('hospitalSelect').value;
      if (unidadActual !== "TODAS") document.getElementById('formUnidad').value = unidadActual;
      document.getElementById('formProveedor').value = '';
      document.getElementById('formPaciente').value = '';
      document.getElementById('formMonto').value = '';
      document.getElementById('modalRegistro').style.display = 'flex';
    }

    function cerrarModal() { document.getElementById('modalRegistro').style.display = 'none'; }

    function guardarRegistro() {
      const payload = {
        action: "add",
        unidad: document.getElementById('formUnidad').value,
        servicio: document.getElementById('formServicio').value,
        proveedor: document.getElementById('formProveedor').value,
        paciente: document.getElementById('formPaciente').value,
        monto: document.getElementById('formMonto').value,
        estatusHomologado: document.getElementById('formEstatus').value
      };

      if (!payload.proveedor || !payload.paciente || !payload.monto) {
        alert("Llena los campos de Proveedor, Paciente y Monto."); return;
      }
      const btn = document.getElementById('btnGuardar');
      btn.innerText = "Guardando..."; btn.disabled = true;

      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(response => response.json())
      .then(result => {
        btn.innerText = "Guardar Registro"; btn.disabled = false;
        if (result.status === "success") { alert("¡Registro guardado!"); cerrarModal(); loadData(); } 
        else { alert("Error: " + result.message); }
      }).catch(error => { btn.innerText = "Guardar Registro"; btn.disabled = false; alert("Error de red."); });
    }

    function abrirModalEdicion(id, proveedor, paciente) {
      document.getElementById('editId').value = id;
      document.getElementById('editInfo').innerText = `Expediente #${id} - ${proveedor} (${paciente})`;
      document.getElementById('editFechaPago').value = new Date().toISOString().split('T')[0];
      document.getElementById('modalEdicion').style.display = 'flex';
    }

    function cerrarModalEdicion() { document.getElementById('modalEdicion').style.display = 'none'; }

    function guardarEdicion() {
      const payload = {
        action: "edit",
        id: document.getElementById('editId').value,
        estatusHomologado: document.getElementById('editEstatus').value,
        fechaPago: document.getElementById('editFechaPago').value
      };

      if (!payload.fechaPago) { alert("Por favor selecciona una fecha de pago."); return; }

      const btn = document.getElementById('btnGuardarEdicion');
      btn.innerText = "Actualizando..."; btn.disabled = true;

      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(response => response.json())
      .then(result => {
        btn.innerText = "Actualizar"; btn.disabled = false;
        if (result.status === "success") { cerrarModalEdicion(); loadData(); } 
        else { alert("Error: " + result.message); }
      }).catch(error => { btn.innerText = "Actualizar"; btn.disabled = false; alert("Error de red."); });
    }

    window.onload = loadData;
  </script>
</body>
</html>
