<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Servicios Subrogados</title>
  
  <!-- Librerías de Chart.js y DataLabels -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  
  <style>
    /* Diseño general inspirado en dashboards modernos */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212; /* Fondo oscuro */
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      margin-bottom: 25px;
      border-left: 5px solid #b99725;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      color: #fff;
    }
    .header select {
      padding: 10px;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      background-color: #2c2c2c;
      color: #fff;
      border: 1px solid #444;
      cursor: pointer;
    }
    .kpi-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }
    .kpi-card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
    }
    .kpi-title {
      font-size: 14px;
      color: #aaa;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .kpi-value {
      font-size: 26px;
      font-weight: bold;
      color: #b99725; /* Dorado principal */
    }
    .charts-container {
      display: grid;
      grid-template-columns: 1fr 2.5fr;
      gap: 20px;
      margin-bottom: 25px;
    }
    .chart-card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      position: relative;
      height: 400px;
    }
    .table-section {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .filter-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
    }
    .filter-container label {
      font-weight: bold;
      color: #ccc;
    }
    .filter-container select {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background-color: #2c2c2c;
      color: #fff;
      flex-grow: 1;
      max-width: 400px;
    }
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th {
      background-color: #2c2c2c;
      color: #fff;
      font-weight: bold;
    }
    tr:hover {
      background-color: #2a2a2a;
    }
    #loading {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #b99725;
      padding: 50px;
    }
  </style>
</head>
<body>

  <!-- Encabezado con el selector global -->
  <div class="header">
    <h1>📊 Dashboard de Servicios Subrogados</h1>
    <select id="hospitalSelect" onchange="loadData()">
      <option value="TODAS">TODAS LAS UNIDADES (GLOBAL)</option>
      <option value="HG CANCÚN" selected>HG CANCÚN</option>
      <option value="HG PLAYA DEL CARMEN">HG PLAYA DEL CARMEN</option>
      <option value="HG CHETUMAL">HG CHETUMAL</option>
      <option value="HG COZUMEL">HG COZUMEL</option>
      <option value="HG FCP">HG FELIPE CARRILLO PUERTO</option>
      <option value="DSS">DSS</option>
    </select>
  </div>

  <!-- Pantalla de carga -->
  <div id="loading">Sincronizando datos con Google Sheets...</div>

  <!-- Contenedor principal del Dashboard -->
  <div id="dashboard-content" style="display: none;">
    
    <!-- Tarjetas de KPIs -->
    <div class="kpi-container">
      <div class="kpi-card">
        <div class="kpi-title">Deuda Inicial Original</div>
        <div class="kpi-value" id="kpi-inicial">$0.00</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Monto Total Pagado</div>
        <div class="kpi-value" id="kpi-pagado" style="color: #4caf50;">$0.00</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Deuda Pendiente Activa</div>
        <div class="kpi-value" id="kpi-pendiente">$0.00</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Expedientes Pendientes</div>
        <div class="kpi-value" id="kpi-expedientes" style="color: #ff9800;">0</div>
      </div>
    </div>

    <!-- Gráficas -->
    <div class="charts-container">
      <div class="chart-card">
        <canvas id="donutChart"></canvas>
      </div>
      <div class="chart-card">
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <!-- Sección de la Tabla de Datos con Filtro de Proveedor -->
    <div class="table-section">
      <div class="filter-container">
        <label for="proveedorSelect">🔍 Filtrar expedientes por Proveedor:</label>
        <select id="proveedorSelect" onchange="aplicarFiltroProveedor()">
          <option value="TODOS">TODOS LOS PROVEEDORES</option>
        </select>
      </div>
      
      <div class="table-wrapper">
        <table id="tabla-servicios">
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Servicio</th>
              <th>Tipo</th>
              <th>Paciente</th>
              <th style="text-align: right;">Monto Total</th>
            </tr>
          </thead>
          <tbody>
            <!-- Los datos se inyectarán aquí vía JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN PRINCIPAL
    // ==========================================
    // ¡OJO! Reemplaza este enlace con el URL de tu API de Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbyC9T_M_T8E9jB8F5yG-k3Y6bN/exec"; 

    // Variables globales
    let donutChart = null;
    let barChart = null;
    let tablaGlobal = []; // Almacena la tabla completa de la unidad seleccionada

    // Formateador de moneda MXN
    const formatter = new Intl.NumberFormat('es-MX', { 
      style: 'currency', 
      currency: 'MXN' 
    });
    
    // Configuración global para Chart.js en modo oscuro
    Chart.defaults.color = '#ccc';
    Chart.defaults.borderColor = '#333';

    // ==========================================
    // FUNCIÓN DE CARGA DE DATOS (Con Cache-Busting)
    // ==========================================
    function loadData() {
      const unidad = document.getElementById('hospitalSelect').value;
      
      // Cache-Busting: Añadimos un timestamp para forzar a leer el Excel actualizado
      const url = API_URL + "?unidad=" + encodeURIComponent(unidad) + "&t=" + new Date().getTime();
      
      // Mostrar estado de carga
      document.getElementById('loading').style.display = 'block';
      document.getElementById('dashboard-content').style.display = 'none';

      fetch(url)
        .then(response => response.json())
        .then(data => {
          // 1. Llenar KPIs
          document.getElementById('kpi-inicial').innerText = formatter.format(data.kpis.deudaInicial);
          document.getElementById('kpi-pagado').innerText = formatter.format(data.kpis.montoPagado);
          document.getElementById('kpi-pendiente').innerText = formatter.format(data.kpis.deudaTotal);
          document.getElementById('kpi-expedientes').innerText = data.kpis.expedientesPendientes;

          // 2. Dibujar Gráficas
          renderCharts(data);
          
          // 3. Procesar Tabla y Combobox de Proveedores
          tablaGlobal = data.table;
          llenarSelectProveedores();
          aplicarFiltroProveedor(); // Dibuja la tabla completa de inicio

          // Ocultar carga y mostrar dashboard
          document.getElementById('loading').style.display = 'none';
          document.getElementById('dashboard-content').style.display = 'block';
        })
        .catch(error => {
          console.error("Error obteniendo datos: ", error);
          document.getElementById('loading').innerHTML = "⚠️ Hubo un error de conexión. Revisa los permisos de Apps Script.";
        });
    }

    // ==========================================
    // FUNCIÓN PARA RENDERIZAR GRÁFICAS
    // ==========================================
    function renderCharts(data) {
      
      // --- Gráfica de Dona (Avance Financiero) ---
      if(donutChart) donutChart.destroy();
      const ctxDonut = document.getElementById('donutChart').getContext('2d');
      donutChart = new Chart(ctxDonut, {
        type: 'doughnut',
        data: {
          labels: ['Pagado', 'Pendiente'],
          datasets: [{
            data: [data.kpis.montoPagado, data.kpis.deudaTotal],
            backgroundColor: ['#4caf50', '#b99725'], // Verde y Dorado
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: { display: true, text: 'Avance de Pagos Global', color: '#fff', font: { size: 16 } },
            legend: { position: 'bottom', labels: { color: '#ccc' } },
            datalabels: { display: false } // Desactivado para no saturar la dona
          }
        }
      });

      // --- Gráfica de Barras (Top 10 Proveedores) ---
      if(barChart) barChart.destroy();
      const ctxBar = document.getElementById('barChart').getContext('2d');
      barChart = new Chart(ctxBar, {
        type: 'bar',
        plugins: [ChartDataLabels], // Activamos plugin de texto
        data: {
          labels: data.graficaProveedores.labels,
          datasets: [{
            label: 'Deuda Pendiente ($)',
            data: data.graficaProveedores.values,
            backgroundColor: '#b99725',
            borderRadius: 4
          }]
        },
        options: {
          indexAxis: 'y', // Barras horizontales
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: { right: 80 } // Espacio para que quepan las cifras
          },
          plugins: {
            title: { display: true, text: 'Top 10 Proveedores (Mayor Deuda Activa)', color: '#fff', font: { size: 16 } },
            legend: { display: false },
            datalabels: {
              anchor: 'end',
              align: 'right',
              color: '#e0e0e0',
              font: { weight: 'bold', size: 11 },
              formatter: function(value) {
                return formatter.format(value);
              }
            }
          },
          scales: {
            x: { 
              grid: { color: '#333' },
              ticks: { callback: function(value) { return formatter.format(value); } }
            },
            y: { grid: { display: false } }
          }
        }
      });
    }

    // ==========================================
    // FUNCIONES DEL FILTRO DE PROVEEDORES
    // ==========================================
    function llenarSelectProveedores() {
      const select = document.getElementById('proveedorSelect');
      // Reseteamos las opciones
      select.innerHTML = '<option value="TODOS">TODOS LOS PROVEEDORES</option>';
      
      // Extraemos los nombres (columna 0)
      let proveedores = tablaGlobal.map(fila => fila[0]);
      
      // Filtramos únicos y ordenamos A-Z
      let proveedoresUnicos = [...new Set(proveedores)].sort();
      
      // Creamos las opciones del combobox
      proveedoresUnicos.forEach(prov => {
        if (prov && prov.trim() !== "") {
          let opt = document.createElement('option');
          opt.value = prov;
          opt.textContent = prov;
          select.appendChild(opt);
        }
      });
    }

    function aplicarFiltroProveedor() {
      const provSelect = document.getElementById('proveedorSelect').value;
      const tbody = document.querySelector('#tabla-servicios tbody');
      tbody.innerHTML = ''; // Limpiamos la tabla
      
      let tablaFiltrada = tablaGlobal;
      
      // Si eligió algo distinto a "TODOS", filtramos la tabla global
      if (provSelect !== "TODOS") {
        tablaFiltrada = tablaGlobal.filter(fila => fila[0] === provSelect);
      }
      
      // Inyectamos las filas filtradas
      tablaFiltrada.forEach(row => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight:bold;">${row[0]}</td>
          <td>${row[1]}</td>
          <td>${row[2]}</td>
          <td>${row[3]}</td>
          <td style="text-align: right; color:#b99725; font-weight: bold;">${formatter.format(row[4])}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Cargar los datos al iniciar la ventana
    window.onload = loadData;
  </script>
</body>
</html>
